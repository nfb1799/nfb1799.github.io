<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#30548d" />

    <!-- Fonts: loaded here rather than via CSS @import so they fetch in parallel
         with the stylesheet instead of waiting for it to parse. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;500;600;700&display=swap"
    />
    <!-- display=block keeps icon ligatures invisible until the font loads,
         instead of flashing their literal names (e.g. "check_circle"). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block"
    />

    <title>Nik Barbero | Full Stack Software Engineer</title>
    <meta
      name="description"
      content="Full Stack Software Engineer with 3+ years building enterprise web applications used by thousands of utility-industry users. Vue.js, React, Next.js, C#/.NET, and SQL Server. Graduated Summa Cum Laude from RIT. Currently open to new opportunities."
    />
    <meta name="author" content="Nik Barbero" />
    <link rel="canonical" href="https://nfb1799.github.io/" />

    <!-- Open Graph (LinkedIn, Slack, iMessage, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nfb1799.github.io/" />
    <meta property="og:title" content="Nik Barbero | Full Stack Software Engineer" />
    <meta
      property="og:description"
      content="3+ years building enterprise web apps in Vue.js, React, and C#/.NET. Currently open to new opportunities."
    />
    <meta property="og:image" content="https://nfb1799.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nik Barbero — Full Stack Software Engineer" />

    <!-- Twitter / X -->

    <meta name="twitter:title" content="Nik Barbero | Full Stack Software Engineer" />
    <meta
      name="twitter:description"
      content="3+ years building enterprise web apps in Vue.js, React, and C#/.NET. Currently open to new opportunities."
    />
    <meta name="twitter:image" content="https://nfb1799.github.io/og-image.jpg" />

  </head>
  <body>

</html>
